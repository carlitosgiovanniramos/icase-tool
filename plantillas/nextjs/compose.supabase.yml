# Next.js con Supabase: el navegador llega a la puerta de entrada por la dirección que fija el runner al
# compilar (localhost y su puerto en la PC; la dirección pública HTTPS en el servidor); el servidor de
# Next.js llega por la red interna (api-gw:8000).
services:
  web:
    build:
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_URL_PUBLICA:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
    environment:
      SUPABASE_URL_INTERNA: http://api-gw:8000
    depends_on:
      api-gw:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
