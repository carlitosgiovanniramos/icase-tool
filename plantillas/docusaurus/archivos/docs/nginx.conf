# Sitio estático de Docusaurus: cada página es <ruta>/index.html. Las redirecciones son relativas para que
# funcionen detrás del proxy HTTPS (otro puerto y otro esquema).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  error_page 404 /404.html;
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
}
