# Alta disponibilidad: todo va al master; si no responde, nginx pasa la petición al esclavo
# (servidor "backup") sin que el usuario lo note. El servicio y el puerto los completa icase-tool.
upstream servidores {
  server {{servicio}}-master:{{puerto}} max_fails=1 fail_timeout=10s;
  server {{servicio}}-esclavo:{{puerto}} backup;
}

server {
  listen 80;

  location / {
    proxy_pass http://servidores;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_connect_timeout 2s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
