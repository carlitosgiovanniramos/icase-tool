# API REST con Node.js/Express. Debe escuchar en el puerto 4000 y responder GET /api/salud.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/salud || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
