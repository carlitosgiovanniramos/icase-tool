server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las llamadas a la API se reenvían al contenedor "backend" por la red interna de Docker.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Cualquier otra ruta la resuelve React (por ejemplo /personal/3 al recargar la página).
  location / {
    try_files $uri /index.html;
  }
}
