# Tres contenedores, uno por capa. Se comunican por la red interna que Docker crea para el
# proyecto: cada servicio se encuentra por su nombre (db, backend, frontend).

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-app}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD en el archivo .env}
    volumes:
      - datos_db:/var/lib/postgresql/data           # los datos sobreviven a reinicios
      - ./database/init:/docker-entrypoint-initdb.d:ro  # esquema y datos de prueba, solo la primera vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
    # Sin "ports": la base de datos solo es visible para el backend.

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${DB_USER:-app}:${DB_PASSWORD}@db:5432/${DB_NAME:-app}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy                  # espera a que PostgreSQL acepte conexiones
    ports:
      - "${BACKEND_PORT:-4000}:4000"                # publicado solo para probar la API directamente
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/salud || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }

volumes:
  datos_db:
